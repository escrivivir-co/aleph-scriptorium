services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - mongo_data:/data/db

  graphdb:
    image: ontotext/graphdb:10.6.0
    ports:
      - '7200:7200'
    environment:
      GDB_JAVA_OPTS: '-Xmx2g'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7200/rest/repositories']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  graphql:
    build:
      context: .
      dockerfile: packages/graphql/Dockerfile
    ports:
      - '4000:4000'
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: network_engine
      GRAPHQL_PORT: '4000'
    depends_on:
      mongo:
        condition: service_healthy

  node-red:
    image: nodered/node-red:latest
    ports:
      - '1880:1880'
    environment:
      - TZ=UTC
    volumes:
      - node_red_data:/data

volumes:
  mongo_data:
  node_red_data:
