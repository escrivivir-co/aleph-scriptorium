<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Compose Stack Digital Twin</title>
  </head>
  <body>
    <main class="main">
      <header class="header">
        <h1 class="title">Compose Stack</h1>
        <p class="subtitle">Digital Twin Simulator</p>
        <p id="clock-label" class="clock-label">virtual clock: 0ms</p>
      </header>

      <section class="panel">
        <h2 class="panel-title">Topology</h2>
        <div id="topology-graph" class="topology-graph"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Time scrubber</h2>
        <input id="tick-slider" type="range" min="100" max="60000" step="100" value="1000" />
        <button id="tick-btn" type="button">Advance clock</button>
      </section>

      <section class="panel">
        <h2 class="panel-title">Phrases</h2>
        <ul id="phrases-list" class="phrases-list"></ul>
      </section>

      <section class="panel">
        <h2 class="panel-title">Healthcheck inspector</h2>
        <pre id="healthcheck-inspector" class="inspector"></pre>
      </section>

      <section class="panel">
        <h2 class="panel-title">Failure injector</h2>
        <select id="failure-service"></select>
        <button id="inject-failure-btn" type="button">Inject failure</button>
      </section>

      <footer class="footer">
        <button id="up-btn" type="button">Simulate up</button>
        <button id="down-btn" type="button">Simulate down</button>
        <button id="reset-btn" type="button">Reset</button>
        <button id="refresh-btn" type="button">Refresh</button>
      </footer>
    </main>
    <script type="module" src="./mcp-app.ts"></script>
  </body>
</html>
